# https://docs.docker.com/compose/compose-file/

services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.1
    ports:
      - 127.0.0.1:5000:5000 # the server has no authentication: keep it local
    volumes:
      - type: bind
        source: ./mlflow.db
        target: /mlflow/mlflow.db
        bind:
          create_host_path: false
      - ./mlruns:/mlflow/mlruns
    working_dir: /mlflow
    # SQLAlchemy backend, same store the package writes to locally: the file store is in
    # maintenance mode and disabled by default in the supported MLflow version.
    command: mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:///mlflow.db --artifacts-destination ./mlruns
