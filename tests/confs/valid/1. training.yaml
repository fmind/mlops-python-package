job:
  KIND: TrainingJob
  inputs:
    KIND: ParquetReader
    path: "${tests_path:}/data/inputs_sample.parquet"
    limit: 1500
  targets:
    KIND: ParquetReader
    path: "${tests_path:}/data/targets_sample.parquet"
    limit: 1500
  # keep most of the 1500 sample rows for training (the default test split holds out 1440)
  splitter:
    KIND: TrainTestSplitter
    test_size: 300
